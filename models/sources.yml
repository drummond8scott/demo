version: 2

sources:
  - name: input_seeds
    database: learn_tuva
    schema: input_layer
    tables:

      - name: medical_claim
        description: >
          Claim-line grain. Verified 2026-08-15: (claim_id, claim_line_number, data_source)
          is unique. NO dense natural key exists at line grain; professional lines with
          charge_amount = 0 are identical on every business column and differ only by claim_id.
          Density profile 2026-08-15: line_start/line_end/allowed/pos null on 34,521 rows
          (institutional lines); header dates, charge_amount, payer, data_source fully dense.
        tests:
          # Sentinel A: technical grain, the package's declared key
          - dbt_utils.unique_combination_of_columns:
              combination_of_columns:
                - claim_id
                - claim_line_number
                - data_source
              config:
                severity: error
                tags: [sentinel, sentinel_a]
          # Sentinel B (natural key) DROPPED per B2.2 measurement. Replaced by Sentinel D below.
        columns:
          - name: claim_id
            tests:
              - not_null:
                  config: {tags: [sentinel]}
          - name: member_id
            tests:
              - not_null:
                  config: {tags: [sentinel]}

      - name: eligibility
        description: Enrollment-span grain per member per payer/plan.
        tests:
          - dbt_utils.unique_combination_of_columns:
              combination_of_columns:
                - person_id
                - member_id
                - enrollment_start_date
                - enrollment_end_date
                - plan
                - payer
                - data_source
              config:
                severity: error
                tags: [sentinel, sentinel_a]
        columns:
          - name: member_id
            tests:
              - not_null:
                  config: {tags: [sentinel]}

      - name: pharmacy_claim
      - name: appointment
      - name: immunization
      - name: lab_result
      - name: observation
      - name: provider_attribution_source